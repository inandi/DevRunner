  Author: Gobinda Nandi <gobinda.nandi.public@gmail.com>
  Version: 0.1.1
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CAST</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="../icons/icon-48.png" alt="" width="32" height="32" />
      <div class="header-text">
        <h1 class="brand">CAST</h1>
        <p id="hostname-label" class="hostname" aria-live="polite">…</p>
      </div>
      <div class="header-actions" role="group" aria-label="Backup">
        <button type="button" id="export-btn" class="btn ghost" title="Export all scripts as JSON">Export</button>
        <label class="btn ghost file-btn" title="Replace all scripts from a JSON backup">
          Import
          <input id="import-input" type="file" accept="application/json,.json" hidden />
        </label>
      </div>
    </header>

    <p id="page-status" class="page-status" hidden></p>

    <section class="section scripts-section" aria-labelledby="scripts-heading">
      <h2 id="scripts-heading" class="section-title">Scripts</h2>
      <ul id="script-list" class="script-list"></ul>
      <p id="empty-list" class="empty" hidden>No scripts for this host yet.</p>
    </section>

    <section class="section" aria-labelledby="add-heading">
      <h2 id="add-heading" class="section-title">Add script</h2>
      <form id="add-form" class="add-form">
        <label class="field">
          <span>Name</span>
          <input
            id="script-name"
            type="text"
            name="name"
            autocomplete="off"
            required
            placeholder="Reset Storage &amp; Reload"
          />
        </label>
        <label class="field">
          <span>Code</span>
          <textarea
            id="script-code"
            name="code"
            rows="3"
            required
            placeholder="localStorage.clear(); location.reload();"
            spellcheck="false"
          ></textarea>
        </label>
        <label class="toggle">
          <input id="global-toggle" type="checkbox" />
          <span>Save as global (all domains)</span>
        </label>
        <button type="submit" id="add-btn" class="btn add-btn">
          <svg class="add-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          Add script
        </button>
      </form>
    </section>

    <p id="run-status" class="status run-status" role="status" aria-live="polite"></p>

    <script src="../lib/hostname.js"></script>
    <script src="../lib/storage.js"></script>
    <script src="../lib/execute.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
